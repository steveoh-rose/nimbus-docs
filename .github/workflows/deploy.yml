name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  # Fired by nimbus-ui's own workflow when a new version is published, so
  # these docs stay in sync with the component library automatically.
  # See docs/nimbus-ui-ci-changes.md for the sender-side workflow to add
  # to the nimbus-ui repo.
  repository_dispatch:
    types: [nimbus-ui-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          # TODO: set this to "/<this-repo-name>" once the repo is created,
          # e.g. NEXT_BASE_PATH: /nimbus-ui-docs — matches the project-site
          # URL pattern GitHub Pages uses: <org>.github.io/<repo-name>/
          NEXT_BASE_PATH: ${{ vars.NEXT_BASE_PATH }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
